[package]
name = "context-compressor-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local-first MCP server that compresses source files into high-signal context packs"
license = "MIT"
repository = "https://github.com/pedroricopaula/context-compressor-mcp"
readme = "README.md"
keywords = ["mcp", "llm", "context", "compression"]

[dependencies]
# Async runtime. Explicitly NOT features=["full"] -- see docs/DECISIONS.md ADR-003.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# V3 (Ollama) only. Off by default so the default build compiles no TLS stack.
# ADR-005.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }

[features]
default = []
ollama = ["dep:reqwest"]

[profile.release]
opt-level = "z"   # 8GB RAM box: size over speed. I/O bound anyway.
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Deny the panic paths. CLAUDE.md rule 1, enforced by the compiler where possible.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }
